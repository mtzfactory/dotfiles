##
# WorkTrunk user configuration
# https://worktrunk.dev/config/

##
# Hooks — apply to all repositories
#

[commit.generation]
# command = "llm -m haiku"
# command = "opencode run -m anthropic/claude-haiku-4.5 --variant fast"
command = "codex exec -m gpt-5.1-codex-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"

[list]
summary = true

[[pre-start]]
# Copies gitignored files from the primary worktree using .worktreeinclude
# https://github.com/satococoa/git-worktreeinclude
copy = "wt step copy-ignored"

[[pre-start]]
# Right after the copy, delete Android build state that bakes in ABSOLUTE paths
# to the checkout it was generated in. A copy keeps pointing at the SOURCE
# checkout, so Gradle (e.g. assembleRelease) in the new worktree ends up
# building there instead:
# - android/build/generated/autolinking (React Native / Expo): every
#   `sourceDir` in autolinking.json points at the source checkout's
#   node_modules. It's keyed on package.json's hash, so `expo prebuild` in the
#   worktree does NOT regenerate it and Gradle compiles the native modules
#   inside the source checkout.
# - .cxx at any depth (node_modules/<pkg>/android/.cxx, android/app/.cxx, ...):
#   CMake caches, so ninja runs inside the source checkout's .cxx, can't find
#   the worktree's libraries and leaves build leftovers there.
# Gradle regenerates both for the worktree's own paths on the next build.
# Not doable with [step.copy-ignored] exclude: it only filters the top-level
# ignored entries (node_modules, android, ...), never paths nested inside them.
# Separate [[pre-start]] block so it runs strictly after the copy finishes.
strip-abs-paths = "cd '{{ worktree_path }}' && rm -rf android/build/generated/autolinking && find . -path ./.git -prune -o -type d -name .cxx -prune -exec rm -rf {} +"

[[post-start]]
# Rebase onto upstream when a NEW worktree is created. Moved out of
# pre-start: pre-start hooks BLOCK and a failure (e.g. rebase conflict on a
# branch that diverged from its tracked upstream) aborted the whole `wt
# switch --create`/wto before the herdr workspace ever got opened — you'd
# land back wherever you started with a worktree stuck mid-rebase and no
# space to fix it in. post-start runs in the background after the worktree
# (and its herdr workspace/tabs) already exist, so a conflict just leaves
# that worktree mid-rebase for you to resolve from inside it, instead of
# blocking creation entirely.
sync = "{% if upstream %}git fetch && git rebase {{ upstream }}{% endif %}"

[[post-switch]]
# Create herdr workspace with four tabs when switching branches, grouped
# under the primary repo's space ({{ repo_path }}) — same nesting the TUI's
# "New worktree"/"Open worktree..." menu produces.
# NOTE: {{ base_worktree_path }} ("where you came from") would be a more
# precise anchor for stacked worktree-from-worktree cases, but it's undefined
# when this hook actually runs in the background during a real `wt switch`
# ("Failed to expand user:herdr: undefined value" — confirmed via a live
# failure; `wt -v hook post-switch` run interactively/synchronously DOES show
# it, but that's a different code path). {{ repo_path }} is always defined.
herdr = "$HOME/.config/worktrunk/herdr-session.sh '{{ repo_path | basename | sanitize }}_{{ branch | sanitize }}' '{{ worktree_path }}' '{{ repo_path }}'"

[[pre-remove]]
# Resolve & stash the herdr workspace bound to this worktree while the checkout
# still exists — after removal, path -> workspace can no longer be resolved.
herdr = "$HOME/.config/worktrunk/herdr-session-resolve.sh '{{ worktree_path }}'"

[post-remove]
# Kill the tmux session when removing the worktree
tmux = "tmux kill-session -t '{{ repo_path | basename | sanitize }}_{{ branch | sanitize }}' 2>/dev/null || true"
# Close the herdr workspace (and its tabs) when removing the worktree.
# Args: label, worktree path (primary key), sanitized branch (legacy fallback).
herdr = "$HOME/.config/worktrunk/herdr-session-close.sh '{{ repo_path | basename | sanitize }}_{{ branch | sanitize }}' '{{ worktree_path }}' '{{ branch | sanitize }}'"

