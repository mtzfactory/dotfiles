---
# Role: system — Paquetes base de infraestructura del servidor
# (Los dev tools personales van en el role `dotfiles`.)

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Opt-in: un upgrade desatendido no debe pasar cuando lo único que querías era
# añadir una app. Correr a propósito con: --tags upgrade
- name: Upgrade installed packages
  become: true
  ansible.builtin.apt:
    upgrade: safe
  tags: [never, upgrade]

- name: Install base infrastructure packages
  become: true
  ansible.builtin.apt:
    name: "{{ system_base_packages }}"
    state: present

- name: Set zsh as default shell for the user
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /usr/bin/zsh

- name: Install GitHub CLI
  ansible.builtin.import_tasks: github-cli.yml

- name: Set up glow (Charm apt repo)
  ansible.builtin.import_tasks: glow.yml
