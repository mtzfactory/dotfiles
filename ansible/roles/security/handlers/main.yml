---
- name: restart fail2ban
  become: true
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

# Validar ANTES de reiniciar, en el mismo paso: un drop-in inválido con
# PasswordAuthentication no ya escrito deja la máquina sin acceso SSH.
- name: restart sshd
  become: true
  ansible.builtin.shell: /usr/sbin/sshd -t && systemctl restart ssh
