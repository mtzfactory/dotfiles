---
# Role: git — Importación de la clave GPG para commit signing
#
# ~/.gitconfig NO se gestiona aquí: llega vía symlink de dotfiles
# (create-symlinks.zsh), y ya referencia la clave {{ gpg_key_id }}.
#
# Prerequisito en el Mac (una vez, NO versionar el fichero):
#   gpg --armor --export-secret-keys {{ gpg_key_id }} > ansible/files/gpg_private.asc

- name: Check if GPG key is already imported
  ansible.builtin.shell: gpg --list-secret-keys {{ gpg_key_id }}
  register: gpg_check
  changed_when: false
  failed_when: false

# Si la clave falta Y el .asc tampoco está, el role antiguo moría con un
# "file not found" opaco. Mejor avisar y seguir: el resto del playbook no
# depende de la firma de commits.
- name: Check whether the exported private key is available
  ansible.builtin.stat:
    # Ruta absoluta: `delegate_to: localhost` no garantiza el cwd.
    path: "{{ playbook_dir }}/{{ gpg_private_key_path }}"
  delegate_to: localhost
  become: false
  register: gpg_asc
  when: gpg_check.rc != 0

- name: Warn when the GPG key can be neither found nor imported
  ansible.builtin.debug:
    msg: >-
      La clave GPG {{ gpg_key_id }} no está en el llavero y no existe
      {{ gpg_private_key_path }}. Se omite la firma de commits; exporta la
      clave desde el Mac (ver ansible/files/README.md) y vuelve a correr
      --tags git.
  when:
    - gpg_check.rc != 0
    - not (gpg_asc.stat.exists | default(false))

- name: Import the GPG private key
  when:
    - git_import_gpg_key
    - gpg_check.rc != 0
    - gpg_asc.stat.exists | default(false)
  block:
    - name: Copy GPG private key to host (temporary)
      ansible.builtin.copy:
        src: "{{ gpg_private_key_path }}"
        dest: "/tmp/gpg_private.asc"
        mode: "0600"

    - name: Import GPG private key
      ansible.builtin.shell: gpg --batch --import /tmp/gpg_private.asc

    - name: Set ultimate trust on the key
      ansible.builtin.shell: |
        echo "{{ gpg_key_id }}:6:" | gpg --import-ownertrust

  always:
    - name: Remove temporary key file from host
      ansible.builtin.file:
        path: /tmp/gpg_private.asc
        state: absent
