# ansible.cfg — defaults del aprovisionamiento del home lab
#
# Con este fichero basta `ansible-playbook main.yml` desde ansible/:
# ni -i inventory.ini ni -e @vars.yml (las variables viven en group_vars/
# y host_vars/, que a diferencia de -e sí se pueden sobreescribir por host).

[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = /usr/bin/python3
stdout_callback = yaml
display_skipped_hosts = false
retry_files_enabled = false
nocows = 1

[ssh_connection]
pipelining = true
