---
# host_vars/m8.yml — particularidades del M8 (Ubuntu 26.04, escritorio + home lab)
#
# Este host ya estaba configurado a mano antes de existir el playbook, así que
# aquí se declara lo que difiere de una máquina nueva.

# ── sudo ────────────────────────────────────────────────────────────────────
# Ubuntu 26.04 trae sudo-rs como alternative por defecto en /usr/bin/sudo, y
# el plugin `sudo` de Ansible no se entiende con él: pasa su prompt con -p y
# espera verlo desnudo, pero sudo-rs lo envuelve en el suyo
# ("[sudo: <prompt>] Password: ") y vuelve a preguntar, así que -K se queda
# colgado hasta "Timed out waiting for become success or become password
# prompt". El sudo clásico (paquete `sudo`, 1.9.17) sigue instalado y emite el
# prompt literal, que es lo que Ansible espera.
ansible_become_exe: /usr/bin/sudo.ws

# ── Firewall ────────────────────────────────────────────────────────────────
# Además de SSH/HTTP/HTTPS, este equipo expone escritorio remoto
# (gnome-remote-desktop en 3389/3390) y se administra por Tailscale.
# Sin esto, `ufw enable` cortaría el RDP y todo lo que no sea 22/80/443.
security_ufw_allowed_ports:
  - "80"
  - "443"
  - "3389" # gnome-remote-desktop (RDP)
  - "3390" # gnome-remote-desktop (handover)
  - "22000" # Syncthing: sincronización (TCP)
  - "22000/udp" # Syncthing: sincronización (QUIC)
  - "21027/udp" # Syncthing: descubrimiento en la LAN
  - "8384" # Syncthing: GUI (con contraseña y HTTPS; ver README)
security_ufw_trusted_interfaces:
  - tailscale0

# ── Docker ──────────────────────────────────────────────────────────────────
# Los stacks de docker/stacks declaran `proxy` como red externa (la de
# Traefik), no el `web` por defecto del role.
docker_external_network: proxy
# Hosts que enruta Traefik (las reglas Host(`…local`) de los stacks).
docker_local_hostnames:
  - claves.local
  - glance.local
  - home.local
  - kavita.local
  - portainer.local
  - status.local
  - umami.local
  - whoami.local

# ── Apps de escritorio ──────────────────────────────────────────────────────
system_desktop_packages:
  - keepassxc # Gestor de contraseñas; el .kdbx se sincroniza con Syncthing

# ── Syncthing ───────────────────────────────────────────────────────────────
# Por Tailscale funcionaría sin abrir nada (tailscale0 es de confianza); los
# tres puertos de arriba son para que también sincronice por la LAN.
syncthing_enabled: true

# ── Backups ─────────────────────────────────────────────────────────────────
# Repo restic local en ~/workspace/homelab/backups/restic. El password hay que
# crearlo a mano una vez; mientras falte, el role avisa y no instala el cron.
backups_enabled: true
backup_sources:
  - "{{ home_lab_root }}/notes"
  - "{{ home_lab_root }}/docker/data"
# La contraseña no aparece: el volcado usa las variables del propio contenedor.
backup_db_dumps:
  - name: passbolt
    container: passbolt-db-1
    command: mariadb-dump --single-transaction -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"
